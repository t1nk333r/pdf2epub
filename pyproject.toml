[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-pdf2epub"
version = "0.2.0"
description = "Page-aware Arabic PDF to reflowable EPUB converter"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "PyMuPDF>=1.24",
  "Pillow>=10",
  "pytesseract>=0.3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7"]

[project.scripts]
pdf2epub = "pdf2epub.cli:main"

[tool.setuptools.packages.find]
include = ["pdf2epub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
